name: Release

# Builds the Windows and Ubuntu downloads and attaches them to a GitHub Release.
#  - Push a version tag (v0.2.0): builds and publishes automatically.
#  - Or run it by hand (Actions → Release → Run workflow) with the tag name, for example v0.1.0,
#    to rebuild and attach files to a release that already exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.1.0"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches the app version
        shell: bash
        run: |
          TAG="${VERSION#v}"
          APP=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('quizcaster/__init__.py').read_text()).group(1))")
          echo "tag=$TAG app=$APP"
          if [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG doesn't match quizcaster/__init__.py ($APP)"; exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: python scripts/build_app.py

      - name: Smoke test the built app
        shell: bash
        run: |
          BIN=./dist/QuizCaster/QuizCaster
          [ "$RUNNER_OS" = "Windows" ] && BIN=./dist/QuizCaster/QuizCaster.exe
          OUT=$($BIN --version)
          echo "$OUT"
          echo "$OUT" | grep -q "QuizCaster" || { echo "::error::built app failed --version"; exit 1; }

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "QuizCaster-${VERSION}-windows-x64.zip" QuizCaster >/dev/null
          else
            tar -czf "QuizCaster-${VERSION}-linux-x64.tar.gz" QuizCaster
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: quizcaster-${{ runner.os }}
          path: dist/QuizCaster-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || inputs.tag != ''
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release if needed, then attach the downloads
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists; attaching files."
          else
            gh release create "$VERSION" --title "QuizCaster $VERSION" --generate-notes --verify-tag
          fi
          gh release upload "$VERSION" artifacts/* --clobber
