name: Release

# Push a version tag such as v0.2.0 to build installers and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check tag matches the app version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('quizcaster/__init__.py').read_text()).group(1))")
          echo "tag=$TAG app=$APP"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$TAG" != "$APP" ]; then
            echo "::error::Tag v$TAG doesn't match quizcaster/__init__.py ($APP)"; exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app
        run: python scripts/build_app.py

      - name: Smoke test the built app
        shell: bash
        run: |
          BIN=./dist/QuizCaster/QuizCaster
          [ "$RUNNER_OS" = "Windows" ] && BIN=./dist/QuizCaster/QuizCaster.exe
          OUT=$($BIN --version)
          echo "$OUT"
          echo "$OUT" | grep -q "QuizCaster" || { echo "::error::built app failed --version"; exit 1; }

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "QuizCaster-${GITHUB_REF_NAME:-dev}-windows-x64.zip" QuizCaster >/dev/null
          else
            tar -czf "QuizCaster-${GITHUB_REF_NAME:-dev}-linux-x64.tar.gz" QuizCaster
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: quizcaster-${{ runner.os }}
          path: dist/QuizCaster-*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "QuizCaster $GITHUB_REF_NAME" \
            --generate-notes
